# XcodeGen spec – run: xcodegen generate
# https://github.com/yonaskolb/XcodeGen

name: IndiGoPrototype
options:
  bundleIdPrefix: com.indigo.prototype
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.4.3"
targets:
  IndiGoPrototype:
    type: application
    platform: iOS
    sources:
      - path: IndiGoPrototype
        name: IndiGoPrototype
        excludes:
          - "**/Lottie"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: IndiGoPrototype/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.indigo.prototype
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Lottie
        product: Lottie

  IndiGoPrototype-UT:
    type: application
    platform: iOS
    sources:
      - path: IndiGoPrototype
        name: IndiGoPrototype
        excludes:
          - "**/Lottie"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7XMV37UXV4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: IndiGoPrototype/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "IndiGo Prototype UT"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "This usability testing session records audio for research documentation. You can opt out on the consent screen."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition transcribes session audio on-device so observations are captured automatically."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.indigo.prototype.ut
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UT_VARIANT"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Lottie
        product: Lottie

